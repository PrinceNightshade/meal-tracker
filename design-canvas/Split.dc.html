<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap");
    body { margin: 0; }
    a { color: #C8FF3D; } a:hover { color: #b6e636; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #000; color: #F4F4F5; font-family: 'Geist', -apple-system, sans-serif; box-sizing: border-box; padding: 24px 18px 108px; position: relative;">

  <!-- Header -->
  <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; letter-spacing: 1.4px; color: #5F5F69; font-weight: 600;">MONDAY · SEP 7</span>
      <span style="font-size: 30px; font-weight: 600; letter-spacing: -0.5px;">Today</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #16161A; border: 1px solid #22222A; border-radius: 999px; padding: 7px 12px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #C8FF3D;"></span>
        <span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace;">28</span>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #16161A; border: 1px solid #22222A;"></div>
    </div>
  </div>

  <!-- Compact intake bar (logging-forward: ring shrinks to a slim readout) -->
  <div style="background: #0E0E10; border: 1px solid #22222A; border-radius: 18px; padding: 16px 18px; margin-bottom: 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 30px; font-weight: 700; font-family: 'Geist Mono', monospace; letter-spacing: -1px;">1,574</span>
        <span style="font-size: 13px; color: #5F5F69; font-family: 'Geist Mono', monospace;">/ 2,000 cal</span>
      </div>
      <span style="font-size: 12px; color: #A0A0AA;">426 left</span>
    </div>
    <!-- progress -->
    <div style="height: 8px; border-radius: 999px; background: #16161A; overflow: hidden; margin-bottom: 14px;">
      <div style="height: 100%; width: 79%; border-radius: 999px; background: #C8FF3D;"></div>
    </div>
    <!-- macro micro-row -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px;">PROT</span><span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace;">112</span></div>
        <div style="height: 4px; border-radius: 999px; background: #16161A;"><div style="height: 100%; width: 75%; border-radius: 999px; background: #C8FF3D;"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px;">CARB</span><span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace;">168</span></div>
        <div style="height: 4px; border-radius: 999px; background: #16161A;"><div style="height: 100%; width: 84%; border-radius: 999px; background: #C8FF3D;"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px;">FAT</span><span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace;">52</span></div>
        <div style="height: 4px; border-radius: 999px; background: #16161A;"><div style="height: 100%; width: 80%; border-radius: 999px; background: #C8FF3D;"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px;">SUGAR</span><span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace; color: #FFB547;">21</span></div>
        <div style="height: 4px; border-radius: 999px; background: #16161A;"><div style="height: 100%; width: 84%; border-radius: 999px; background: #FFB547;"></div></div>
      </div>
    </div>
  </div>

  <!-- Primary action: logging is the job of this screen -->
  <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 18px;">
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #C8FF3D; color: #0A0A0A; border: none; border-radius: 16px; padding: 15px; font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Log food
    </button>
    <button style="display: flex; align-items: center; justify-content: center; background: #16161A; border: 1px solid #22222A; border-radius: 16px; padding: 15px 16px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M4 12h16"/></svg>
    </button>
    <button style="display: flex; align-items: center; justify-content: center; background: #16161A; border: 1px solid #22222A; border-radius: 16px; padding: 15px 16px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-14 2 9h6"/></svg>
    </button>
  </div>

  <!-- Meals get the real estate -->
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <!-- Breakfast -->
    <div style="background: #0E0E10; border: 1px solid #22222A; border-radius: 18px; padding: 14px 16px; border-left: 3px solid #FFB547;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div><div style="font-size: 15px; font-weight: 600;">Breakfast</div><div style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px; margin-top: 2px;">MORNING</div></div>
        <span style="font-size: 14px; font-weight: 600; font-family: 'Geist Mono', monospace; color: #A0A0AA;">420 <span style="font-size: 10px; color: #5F5F69;">cal</span></span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #16161A;">
        <span style="font-size: 13px; color: #F4F4F5;">Greek yogurt + berries</span>
        <span style="font-size: 12px; color: #5F5F69; font-family: 'Geist Mono', monospace;">220</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0 2px; border-top: 1px solid #16161A;">
        <span style="font-size: 13px; color: #F4F4F5;">Coffee, oat milk</span>
        <span style="font-size: 12px; color: #5F5F69; font-family: 'Geist Mono', monospace;">200</span>
      </div>
    </div>
    <!-- Lunch -->
    <div style="background: #0E0E10; border: 1px solid #22222A; border-radius: 18px; padding: 14px 16px; border-left: 3px solid #C8FF3D;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div><div style="font-size: 15px; font-weight: 600;">Lunch</div><div style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px; margin-top: 2px;">MIDDAY</div></div>
        <span style="font-size: 14px; font-weight: 600; font-family: 'Geist Mono', monospace; color: #A0A0AA;">640 <span style="font-size: 10px; color: #5F5F69;">cal</span></span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0 2px; border-top: 1px solid #16161A;">
        <span style="font-size: 13px; color: #F4F4F5;">Chicken burrito bowl</span>
        <span style="font-size: 12px; color: #5F5F69; font-family: 'Geist Mono', monospace;">640</span>
      </div>
    </div>
    <!-- Dinner (empty, tappable) -->
    <div style="background: #0E0E10; border: 1px dashed #22222A; border-radius: 18px; padding: 16px; border-left: 3px solid #5BE9F0; display: flex; align-items: center; justify-content: space-between;">
      <div><div style="font-size: 15px; font-weight: 600;">Dinner</div><div style="font-size: 10px; color: #5F5F69; letter-spacing: 0.5px; margin-top: 2px;">TAP TO ADD</div></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5F69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <!-- Slim Pulse teaser: the reflect surface lives one tap away -->
  <div style="margin-top: 14px; background: linear-gradient(180deg, rgba(200,255,61,0.06), rgba(200,255,61,0.02)); border: 1px solid #2b3320; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-14 2 9h6"/></svg>
      <div>
        <div style="font-size: 13px; font-weight: 600;">1 opportunity this week</div>
        <div style="font-size: 11px; color: #A0A0AA; margin-top: 2px;">Sleep is driving your intake — see Pulse</div>
      </div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F5F69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <!-- Bottom nav: Log · Pulse · Goals -->
  <div style="position: absolute; left: 18px; right: 18px; bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(20,20,24,0.85); backdrop-filter: blur(20px); border: 1px solid #22222A; border-radius: 999px; padding: 8px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #C8FF3D; color: #0A0A0A; border-radius: 999px; padding: 11px; font-size: 14px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7v8l9-12h-7V2z"/></svg> Log
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #A0A0AA; padding: 11px; font-size: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-14 2 9h6"/></svg> Pulse
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #A0A0AA; padding: 11px; font-size: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg> Goals
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

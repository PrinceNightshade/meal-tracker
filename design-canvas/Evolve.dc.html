<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap");
    body { margin: 0; }
    a { color: #C8FF3D; } a:hover { color: #b6e636; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #000; color: #F4F4F5; font-family: 'Geist', -apple-system, sans-serif; box-sizing: border-box; padding: 24px 18px 108px; position: relative;">

  <!-- Header -->
  <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; letter-spacing: 1.4px; color: #5F5F69; font-weight: 600;">MONDAY</span>
      <span style="font-size: 30px; font-weight: 600; letter-spacing: -0.5px;">Today</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #16161A; border: 1px solid #22222A; border-radius: 999px; padding: 7px 12px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #C8FF3D;"></span>
        <span style="font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace;">28</span>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #16161A; border: 1px solid #22222A;"></div>
    </div>
  </div>

  <!-- Existing hero: big ring + 4 macro cards (kept) -->
  <div style="background: radial-gradient(120% 90% at 50% 0%, rgba(200,255,61,0.08), rgba(14,14,16,0) 60%), #0E0E10; border: 1px solid #22222A; border-radius: 24px; padding: 20px 18px; margin-bottom: 12px;">
    <div style="display: flex; justify-content: center; margin-bottom: 18px;">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="62" fill="none" stroke="#16161A" stroke-width="11"/>
        <circle cx="75" cy="75" r="62" fill="none" stroke="#C8FF3D" stroke-width="11" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="82" transform="rotate(-90 75 75)"/>
        <text x="75" y="72" text-anchor="middle" fill="#F4F4F5" font-size="36" font-weight="700" font-family="'Geist Mono',monospace">1574</text>
        <text x="75" y="92" text-anchor="middle" fill="#5F5F69" font-size="11" font-family="'Geist Mono',monospace">/ 2000 CAL</text>
      </svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px;">
      <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:10px 8px;"><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px;">PROTEIN</div><div style="font-size:15px; font-weight:700; font-family:'Geist Mono',monospace; margin-top:3px;">112<span style="font-size:9px; color:#5F5F69;">/150</span></div><div style="height:3px; border-radius:2px; background:#22222A; margin-top:6px;"><div style="height:100%; width:75%; background:#C8FF3D; border-radius:2px;"></div></div></div>
      <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:10px 8px;"><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px;">CARBS</div><div style="font-size:15px; font-weight:700; font-family:'Geist Mono',monospace; margin-top:3px;">168<span style="font-size:9px; color:#5F5F69;">/200</span></div><div style="height:3px; border-radius:2px; background:#22222A; margin-top:6px;"><div style="height:100%; width:84%; background:#C8FF3D; border-radius:2px;"></div></div></div>
      <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:10px 8px;"><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px;">FAT</div><div style="font-size:15px; font-weight:700; font-family:'Geist Mono',monospace; margin-top:3px;">52<span style="font-size:9px; color:#5F5F69;">/65</span></div><div style="height:3px; border-radius:2px; background:#22222A; margin-top:6px;"><div style="height:100%; width:80%; background:#C8FF3D; border-radius:2px;"></div></div></div>
      <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:10px 8px;"><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px;">SUGAR</div><div style="font-size:15px; font-weight:700; font-family:'Geist Mono',monospace; margin-top:3px; color:#FFB547;">21<span style="font-size:9px; color:#5F5F69;">/25</span></div><div style="height:3px; border-radius:2px; background:#22222A; margin-top:6px;"><div style="height:100%; width:84%; background:#FFB547; border-radius:2px;"></div></div></div>
    </div>
  </div>

  <!-- CHANGE: opportunity pulled out of the carousel into its own always-visible slim card -->
  <div style="background: linear-gradient(160deg, rgba(255,181,71,0.09), rgba(14,14,16,0.3)); border: 1px solid #3a2f1c; border-radius: 18px; padding: 14px 16px; margin-bottom: 10px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFB547"><path d="M13 2L4 14h7v8l9-12h-7V2z"/></svg>
      <span style="font-size:10px; letter-spacing:1px; color:#FFB547; font-weight:600;">OPPORTUNITY · THIS WEEK</span>
    </div>
    <div style="font-size:15px; font-weight:600; line-height:1.3;">You eat ~487 more calories after a short night</div>
  </div>

  <!-- Wellness strip (kept) -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px;">
    <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:11px 8px; text-align:center;"><div style="font-size:16px; font-weight:700; font-family:'Geist Mono',monospace;">8,561</div><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px; margin-top:3px;">STEPS / DAY</div></div>
    <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:11px 8px; text-align:center;"><div style="font-size:16px; font-weight:700; font-family:'Geist Mono',monospace;">6h 36m</div><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px; margin-top:3px;">SLEEP / NIGHT</div></div>
    <div style="background:#16161A; border:1px solid #22222A; border-radius:14px; padding:11px 8px; text-align:center;"><div style="font-size:16px; font-weight:700; font-family:'Geist Mono',monospace;">3</div><div style="font-size:9px; color:#5F5F69; letter-spacing:0.5px; margin-top:3px;">WORKOUT DAYS</div></div>
  </div>

  <!-- Action row (kept) -->
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;">
    <div style="display:flex; align-items:center; justify-content:center; gap:6px; background:#16161A; border:1px solid #22222A; border-radius:14px; padding:13px; font-size:13px; color:#A0A0AA;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5BE9F0" stroke-width="2"><path d="M12 3c1.5 4 6 5 6 9a6 6 0 0 1-12 0c0-4 4.5-5 6-9z"/></svg>Water</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:6px; background:#16161A; border:1px solid #22222A; border-radius:14px; padding:13px; font-size:13px; color:#A0A0AA;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="1.9" stroke-linecap="round"><path d="M4 7V5h3M17 4h3v3M20 17v2h-3M7 20H4v-3M4 12h16"/></svg>Scan</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:6px; background:#C8FF3D; color:#0A0A0A; border-radius:14px; padding:13px; font-size:13px; font-weight:600;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2"><path d="M13 2L4 14h7v8l9-12h-7V2z"/></svg>Log</div>
  </div>

  <!-- Meals condensed -->
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#0E0E10; border:1px solid #22222A; border-radius:16px; padding:13px 15px; border-left:3px solid #FFB547; display:flex; justify-content:space-between; align-items:center;"><span style="font-size:14px; font-weight:600;">Breakfast</span><span style="font-size:13px; color:#A0A0AA; font-family:'Geist Mono',monospace;">420</span></div>
    <div style="background:#0E0E10; border:1px solid #22222A; border-radius:16px; padding:13px 15px; border-left:3px solid #C8FF3D; display:flex; justify-content:space-between; align-items:center;"><span style="font-size:14px; font-weight:600;">Lunch</span><span style="font-size:13px; color:#A0A0AA; font-family:'Geist Mono',monospace;">640</span></div>
  </div>

  <!-- Bottom nav: unchanged Daily · Weight · Goals -->
  <div style="position: absolute; left: 18px; right: 18px; bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(20,20,24,0.85); backdrop-filter: blur(20px); border: 1px solid #22222A; border-radius: 999px; padding: 8px;">
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; background:#C8FF3D; color:#0A0A0A; border-radius:999px; padding:11px; font-size:14px; font-weight:600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>Daily</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; color:#A0A0AA; padding:11px; font-size:14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 7-7"/></svg>Weight</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; color:#A0A0AA; padding:11px; font-size:14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Goals</div>
  </div>

</div>
</x-dc>
</body>
</html>
